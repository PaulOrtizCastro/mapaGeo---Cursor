<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mapa con Búsqueda por UBIGEO</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v9.2.4/ol.css" />
    <style>
      html, body { height: 100%; margin: 0; }
      #app { display: grid; grid-template-rows: auto 1fr; height: 100%; }
      .toolbar { display: grid; grid-template-columns: 1fr auto; gap: 12px; padding: 10px; background: #f6f7f9; border-bottom: 1px solid #e1e5ea; }
      .filters { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      .filters select { padding: 6px 8px; }
      #map { width: 100%; height: 100%; }
      .popup-header { display: flex; gap: 10px; align-items: center; }
      .popup-header img { width: 40px; height: 40px; object-fit: cover; border-radius: 4px; }
      .popup-title { font-weight: 600; }
      .ol-popup { position: absolute; background-color: white; box-shadow: 0 1px 4px rgba(0,0,0,0.2); padding: 10px; border-radius: 4px; border: 1px solid #cccccc; bottom: 12px; left: -50px; min-width: 240px; }
      .ol-popup:after, .ol-popup:before { top: 100%; border: solid transparent; content: " "; height: 0; width: 0; position: absolute; pointer-events: none; }
      .ol-popup:after { border-top-color: white; border-width: 10px; left: 48px; margin-left: -10px; }
      .ol-popup:before { border-top-color: #cccccc; border-width: 11px; left: 48px; margin-left: -11px; }
      .ol-popup-closer { text-decoration: none; position: absolute; top: 2px; right: 8px; }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="toolbar">
        <div class="filters">
          <label>Mapa base
            <select id="basemapSelect" class="form-select form-select-sm">
              <option value="calles">Calles</option>
              <option value="topo">Topográfico</option>
              <option value="hibrido">Híbrido</option>
            </select>
          </label>
          <label style="position: relative;">
            Dirección
            <input id="addressInput" class="form-control form-control-sm" placeholder="Buscar dirección" list="addressList" autocomplete="off" style="min-width: 280px;" />
            <datalist id="addressList"></datalist>
          </label>
          <label>Región
            <select id="regionSelect" class="form-select form-select-sm">
              <option value="">Todas</option>
            </select>
          </label>
          <label>Provincia
            <select id="provinciaSelect" class="form-select form-select-sm" disabled>
              <option value="">Todas</option>
            </select>
          </label>
          <label>Distrito
            <select id="distritoSelect" class="form-select form-select-sm" disabled>
              <option value="">Todos</option>
            </select>
          </label>
        </div>
      </div>
      <div id="map"></div>
      <div id="popup" class="ol-popup" style="display:none;">
        <a href="#" id="popup-closer" class="ol-popup-closer">✕</a>
        <div id="popup-content"></div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/ol@v9.2.4/dist/ol.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./main.js"></script>
  </body>
  </html>
